# -----------------------------------------------------------------------------
# CI for SpMS.
#
# This is what turns the test suites into DEV-014 evidence. A suite that only
# ever passed on one developer's machine proves that machine works; a suite a
# reviewer can watch run from a clean checkout against a real PostgreSQL is the
# thing a traceability register can point at.
#
# Five jobs, deliberately separate so a failure names itself:
#
#   api       the solution built warnings-as-errors, then the xunit suite against a
#             real postgres:16 - the EF migrations (the R1 baseline is the reviewed
#             SQL), row-level security through SET LOCAL ROLE spms_app, the EF
#             model/schema drift check, the GiST exclusion constraint and the unit
#             of work - then the HTTP acceptance sweep against a freshly started host.
#   web       the Angular production build and the contrast audit.
#   database  the R1 reference schema and the generated EF model both regenerated
#             (each must match what is committed),
#             built on postgres:16 and its SQL tests run: RLS, CON-002, append-only,
#             identity resolution, integrity.
#   authz     the OpenFGA model validated and its tests run.
#   bicep     every deployment template compiled, so a broken template is caught
#             here rather than half way through a deploy.
#
# Everything the API job needs is vendored: backend/vendor/nuget holds the package
# closure and backend/NuGet.config clears the public feeds, so the restore is
# hermetic and a runner with no NuGet access still builds.
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — build, unit and integration
    runs-on: ubuntu-latest

    services:
      postgres:
        # 16, matching the version the exclusion constraint and btree_gist were
        # written against. A major-version drift here would be discovered as a
        # failing constraint rather than as a version mismatch.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spms
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        # Without a health check the first test connects before the server is
        # accepting connections and the whole job fails on a race.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The Postgres cases SKIP silently when this is unset — they are written
      # that way so a developer without a database can still run the domain
      # suite. In CI that silence would be indistinguishable from a pass, which
      # is exactly the failure this job exists to prevent.
      SPMS_TEST_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=spms'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Offline by construction: NuGet.config clears the public sources and
      # points at the vendored feed. --no-restore on the build below then proves
      # the restore actually resolved everything rather than deferring it.
      - name: Restore
        working-directory: backend
        run: dotnet restore Spms.sln

      # Directory.Build.props sets TreatWarningsAsErrors, so this step is also
      # the lint.
      - name: Build
        working-directory: backend
        run: dotnet build Spms.sln -c Release --no-restore

      - name: Test
        working-directory: backend
        run: dotnet test Spms.sln -c Release --no-build --nologo --logger 'trx;LogFileName=results.trx'

      # The unit suite proves the rules; it says nothing about status codes,
      # problem+json bodies, ETag handling, the preflight round trip or the
      # idempotency replay, because those live in HTTP. The sweep must run
      # against a FRESH instance and a fresh database: its cases mutate the
      # seeded board, so a second run would assert against the first run's
      # leftovers.
      - name: Start the API
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5199
          SPMS_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=spms_http;Username=postgres;Password=spms'
        run: |
          PGPASSWORD=spms createdb -h 127.0.0.1 -U postgres spms_http
          nohup dotnet run --project src/Spms.Host -c Release --no-build > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5199/health/ready > /dev/null 2>&1; then
              echo "API ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error::The API did not become ready."
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: HTTP acceptance sweep
        working-directory: backend
        run: node tools/http-acceptance.mjs http://127.0.0.1:5199

      # Unconditionally, and before the job ends: a failed sweep is exactly when
      # the startup log matters, and a still-running child process can hold the
      # job open.
      - name: API log
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/api.pid" ]; then kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true; fi
          echo '--- api.log ---'
          cat "$RUNNER_TEMP/api.log" || true

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: backend/tests/**/TestResults/*.trx
          if-no-files-found: warn

  web:
    name: Web — build and contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version in frontend/package.json's engines field. Angular 22
      # refuses to run below 22.22.3 and the error it gives ("Node.js version
      # detected") does not say which file set the floor.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npx ng build --configuration production

      # The accessibility requirement is a measured contrast ratio, not a
      # promise in a document. This is the measurement.
      - name: Contrast audit
        working-directory: frontend
        run: npm run audit:contrast

  bicep:
    name: Infrastructure — template compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compile only. There is no subscription in scope here and nothing is
      # deployed: this catches the class of error that would otherwise surface
      # part-way through a real deployment, with resources already created.
      - name: Build the template
        run: |
          curl -fsSL -o bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          ./bicep build infra/main.bicep --outfile /dev/null
          ./bicep build infra/openfga.bicep --outfile /dev/null

  database:
    name: Database - R1 schema and SQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spms
          POSTGRES_DB: spms_verify
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # verify.sh first checks the committed SQL is exactly what the model generates,
      # so a hand edit to database/schema cannot slip through.
      - name: Generated EF model is current
        run: python3 database/tools/generate_ef.py --check
      - name: Build schema and run tests
        env:
          PGURL: postgresql://postgres:spms@localhost:5432/spms_verify
        run: database/tools/verify.sh

  authz:
    name: Authorization - OpenFGA model tests
    runs-on: ubuntu-latest
    env:
      FGA_VERSION: 0.7.4
      FGA_SHA256: 05e95247c99e5361fcb837dd6c41cfad2c4e9582d2ba90e571088ef20c87a70e
    steps:
      - uses: actions/checkout@v4
      - name: Install the fga CLI (pinned, checksum-verified)
        run: |
          curl -fsSL -o fga.tgz "https://github.com/openfga/cli/releases/download/v${FGA_VERSION}/fga_${FGA_VERSION}_linux_amd64.tar.gz"
          echo "${FGA_SHA256}  fga.tgz" | sha256sum -c -
          tar -xzf fga.tgz fga
      - name: Validate and test the model
        run: |
          ./fga model validate --file authorization/model.fga
          ./fga model test --tests authorization/model.fga.yaml
